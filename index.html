<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151c" media="(prefers-color-scheme: dark)">
<title>个人健身记录本</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#17212e; --muted:#6b7a8d; --line:#e3e9f0;
  --brand:#0f766e; --brand-soft:#e7f4f2; --brand-ink:#0b5a53;
  --accent:#e2622a; --accent-soft:#fff1e9; --accent-ink:#9b431c;
  --blue:#2563a8; --blue-soft:#eaf2fc; --blue-ink:#1d4f88;
  --chip:#eef2f7; --chip-ink:#4b5b6d; --danger:#c0392b;
  --input:#ffffff; --soft:#fcfdff; --tabs:#e9eef4; --focus:#bfe0da;
  --toast-bg:#17212e; --toast-ink:#ffffff; --on-brand:#ffffff; --on-accent:#ffffff;
  --m-base:#e8eef6; --m-idle:#dfe7f0; --m-line:#adbed0;
  --shadow:0 2px 14px rgba(20,40,70,.07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f151c; --card:#161f2a; --ink:#e7eef6; --muted:#93a4b6; --line:#26313e;
    --brand:#45c3b2; --brand-soft:#10322d; --brand-ink:#83e0d2;
    --accent:#f08c5c; --accent-soft:#35221a; --accent-ink:#f6bb9b;
    --blue:#6babe8; --blue-soft:#152a3d; --blue-ink:#a3cdf6;
    --chip:#1e2a37; --chip-ink:#a9b8c9; --danger:#ef8072;
    --input:#111a24; --soft:#131c26; --tabs:#101821; --focus:#2c635b;
    --toast-bg:#e7eef6; --toast-ink:#121a23; --on-brand:#07231f; --on-accent:#1f1208;
    --m-base:#2b3a4a; --m-idle:#33414f; --m-line:#68798c;
    --shadow:0 2px 14px rgba(0,0,0,.42);
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:26px 18px 70px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:.3px}
h2{font-size:17px;margin:0 0 14px}
h3{font-size:15px;margin:18px 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tabs{display:flex;gap:6px;background:var(--tabs);padding:5px;border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.tab{flex:1;min-width:120px;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--card);color:var(--brand);font-weight:600;box-shadow:var(--shadow)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow)}
.stat span{display:block;color:var(--muted);font-size:12.5px}
.stat b{display:block;font-size:22px;margin-top:3px;letter-spacing:.3px}
.banner{background:var(--brand-soft);border:0;border-left:3px solid var(--brand);border-radius:10px;padding:11px 14px;font-size:13.5px;color:var(--brand-ink);margin-bottom:14px}
.banner.warn{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--input);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--m-line)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.primary:hover{filter:brightness(.93)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:1px 8px;font-size:12px;margin-right:6px}
.chip.m{background:var(--brand-soft);color:var(--brand-ink)}
.chip.o{background:var(--accent-soft);color:var(--accent-ink)}
.chip.b{background:var(--blue-soft);color:var(--blue-ink)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;background:var(--input);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);border-color:var(--brand)}
textarea{resize:vertical;min-height:62px}
.f{display:flex;flex-direction:column}
.plan-item{display:grid;grid-template-columns:38px 1fr 190px;gap:14px;align-items:start;padding:14px 4px;border-bottom:1px dashed var(--line)}
.plan-item:last-child{border-bottom:0}
.num{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.pname{font-weight:650;font-size:15px}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.reason{font-size:12.5px;color:var(--chip-ink);margin-top:6px;line-height:1.55}
.dose{text-align:right;font-weight:650;font-size:14.5px;white-space:nowrap}
.dose small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.ex-row{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px;background:var(--soft)}
.ex-grid{display:grid;grid-template-columns:2fr .8fr .8fr .8fr 1.3fr;gap:9px;align-items:end}
.ex-grid > .f,.row2 > .f{min-width:0}
.row2{display:grid;grid-template-columns:1fr 1.7fr;gap:9px;align-items:end}
.row2 + .row2{margin-top:9px}
.row2.even{grid-template-columns:1fr 1fr}
.row2.wide{grid-template-columns:1.7fr 1fr}
.plan-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.sel-inline{width:auto;display:inline-block;padding:6px 8px;max-width:100%}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
input[type=date]{min-width:0;max-width:100%;appearance:none;-webkit-appearance:none}
.set-row{display:grid;grid-template-columns:60px 1fr 1fr;gap:9px;align-items:center;margin-top:7px;font-size:12.5px;color:var(--muted)}
.barrow{display:grid;grid-template-columns:64px 1fr 46px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
/* 肌群热图 */
.heat-wrap{display:grid;grid-template-columns:150px 150px minmax(200px,320px);gap:22px;align-items:center;justify-content:center;margin-top:14px}
.heat-fig{margin:0;text-align:center}
.heat-fig svg{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
.fig-cap{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:2px}
.heat-info{font-size:12.5px;color:var(--muted);line-height:1.9}
.heat-legend{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:10px}
.heat-legend i{flex:1;height:10px;border-radius:5px;border:1px solid var(--m-line);background:linear-gradient(90deg,hsl(3,58%,91%),hsl(3,80%,42%))}
@media (prefers-color-scheme: dark){
  .heat-legend i{background:linear-gradient(90deg,hsl(3,62%,34%),hsl(3,80%,56%))}
}
.heat-nums{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.hn{background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:2px 8px;font-size:12px}
.hn b{color:var(--ink);font-weight:650}
details{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
summary{cursor:pointer;font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:10px 18px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;box-shadow:0 6px 22px rgba(0,0,0,.2)}
.toast.on{opacity:1}
.hide{display:none!important}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13.5px;margin-bottom:8px}
.kv div:nth-child(odd){color:var(--muted)}
/* 训练容量趋势 */
.trend{display:flex;align-items:flex-end;gap:6px;height:104px;padding:12px 14px 8px;border:1px solid var(--line);border-radius:11px;background:var(--soft);margin:10px 0 6px;overflow:hidden}
.trend-bar{flex:1;min-width:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px}
.trend-bar i{display:block;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--brand);opacity:.85;min-height:3px;transition:opacity .2s}
.trend-bar:hover i{opacity:1}
.trend-x{font-size:10.5px;color:var(--muted);white-space:nowrap}
.banner .btn{vertical-align:middle;margin-left:8px}
.key-warn{margin:0 0 16px;line-height:1.6}
.key-warn b{font-weight:700}
.edit-tip{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:760px){
  .wrap{padding:18px 12px 58px}
  h1{font-size:20px}
  h2{font-size:16px}
  .sub{font-size:12.5px;margin-bottom:14px}
  .grid4{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{padding:11px 12px;border-radius:11px}
  .stat span{font-size:11.5px}
  .stat b{font-size:18px}
  .card{padding:15px;border-radius:12px}
  .tabs{padding:4px;gap:4px}
  .tab{flex:1 0 45%;min-width:0;font-size:13px;padding:8px 6px}
  .plan-item{grid-template-columns:28px 1fr;gap:8px;padding:12px 0}
  .dose{grid-column:2;text-align:left;margin-top:6px}
  .plan-head{flex-direction:column;align-items:stretch}
  .plan-head .btnrow{justify-content:space-between}
  .plan-head .btnrow label{flex:1;display:flex;align-items:center;gap:6px}
  .sel-inline{flex:1;width:100%}
  /* 记录表单：动作名独占一行，组数/次数/重量三列，备注独占一行 */
  .ex-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .ex-grid > .f:nth-child(1),.ex-grid > .f:nth-child(5){grid-column:1/-1}
  .row2,.row2.even,.row2.wide{grid-template-columns:1fr;gap:10px}
  .kv{grid-template-columns:96px 1fr;font-size:13px}
  .trend{height:92px;padding:10px 10px 6px;gap:4px}
  .trend-x{font-size:9.5px}
  .heat-wrap{grid-template-columns:1fr 1fr;gap:10px}
  .heat-info{grid-column:1/-1}
  .heat-fig svg{max-width:132px}
  /* 历史记录表格在窄屏转为分行卡片，避免横向溢出 */
  table,thead,tbody,tr,td,th{display:block}
  thead{display:none}
  tr{padding:9px 0;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:0}
  td{border:0;padding:2px 0;display:grid;grid-template-columns:82px 1fr;gap:8px;word-break:break-word}
  td[data-l="备注"]:empty{display:none}
  td::before{content:attr(data-l);color:var(--muted);font-size:12px}
  input,select,textarea{font-size:16px}
  .btn{padding:9px 13px}
  .btn.sm{padding:6px 10px}
  table{font-size:12.5px}
  th,td{padding:5px 6px}
  .toast{left:12px;right:12px;transform:none;text-align:center}
}
@media(max-width:400px){
  .stat b{font-size:16px}
  .heat-fig svg{max-width:118px}
  .tab{font-size:12.5px}
  .plan-item{grid-template-columns:24px 1fr}
  .num{width:24px;height:24px;font-size:12px}
  .card{padding:13px}
  .ex-grid{gap:7px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>个人健身记录本</h1>
  <p class="sub">按你的节奏内置：周一~周四练 · 力量一周最多 2 次 · 每次 4~6 个动作 · 专注力量与增肌（有氧交给每周 2 次慢跑） · 胸部默认不安排 · 动作只从你现有的器械里选</p>

  <div id="storageWarn" class="hide"></div>

  <div class="grid4" id="overview"></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-act="tab" data-v="plan">下次训练推荐</button>
    <button class="tab" data-act="tab" data-v="log">记录这次训练</button>
    <button class="tab" data-act="tab" data-v="history">历史记录</button>
    <button class="tab" data-act="tab" data-v="settings">设置与备份</button>
  </div>

  <section id="view-plan"></section>
  <section id="view-log" class="hide"></section>
  <section id="view-history" class="hide"></section>
  <section id="view-settings" class="hide"></section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 动作库：只使用你现有的器械 ============
   字段：id 标识 / n 名称 / m 主肌群 / eq 器械 / k 类型 / s 建议组数
        r 次数区间 / u 单位 / w 起始重量kg(0=自重) / st 加重步长 / hi 高冲击 / chest 胸部
*/
const MUSCLES = ['腿','背','肩','臂','核心'];
const EX = [
  // 主项（复合，渐进超负荷的重点）
  {id:'squat',   n:'杠铃深蹲',        m:'腿', eq:'框式深蹲架+奥杆',   k:'main', s:4, r:[6,10],  w:60, st:5},
  {id:'rdl',     n:'罗马尼亚硬拉',    m:'腿', eq:'奥杆 / 哑铃',        k:'main', s:4, r:[8,10],  w:50, st:5},
  {id:'dl',      n:'传统硬拉',        m:'腿', eq:'奥杆+杠铃片',        k:'main', s:4, r:[5,8],   w:70, st:5},
  {id:'bulg',    n:'保加利亚分腿蹲',  m:'腿', eq:'哑铃+可调凳',        k:'main', s:3, r:[8,10], u:'次/侧', w:12, st:2},
  {id:'hip',     n:'杠铃臀推',        m:'腿', eq:'可调凳+奥杆',        k:'main', s:3, r:[10,12], w:50, st:5},
  {id:'pullup',  n:'引体向上',        m:'背', eq:'深蹲架单杠',         k:'main', s:4, r:[6,10],  w:0,  st:0},
  {id:'chinup',  n:'反握引体向上',    m:'背', eq:'深蹲架单杠',         k:'main', s:3, r:[6,10],  w:0,  st:0},
  {id:'brow',    n:'俯身杠铃划船',    m:'背', eq:'奥杆',                k:'main', s:4, r:[8,10],  w:40, st:2.5},
  {id:'drow',    n:'单臂哑铃划船',    m:'背', eq:'哑铃+可调凳',        k:'main', s:3, r:[10,12], w:20, st:2},
  {id:'dbpress', n:'坐姿哑铃肩推',    m:'肩', eq:'可调凳+哑铃',        k:'main', s:3, r:[8,12],  w:14, st:2},
  {id:'bbpress', n:'站姿杠铃肩推',    m:'肩', eq:'深蹲架+奥杆',        k:'main', s:3, r:[6,10],  w:30, st:2.5},
  // 辅助（补短板）
  {id:'lateral', n:'哑铃侧平举',      m:'肩', eq:'哑铃',                k:'assist', s:3, r:[12,15], w:6,  st:1},
  {id:'rearfly', n:'俯身反向飞鸟',    m:'肩', eq:'哑铃+可调凳',        k:'assist', s:3, r:[12,15], w:5,  st:1},
  {id:'face',    n:'俯身哑铃面拉',    m:'肩', eq:'哑铃',                k:'assist', s:3, r:[12,15], w:5,  st:1},
  {id:'frontr',  n:'哑铃前平举',      m:'肩', eq:'哑铃',                k:'assist', s:3, r:[10,12], w:8,  st:1},
  {id:'curl',    n:'哑铃弯举',        m:'臂', eq:'哑铃',                k:'assist', s:3, r:[10,12], w:10, st:1},
  {id:'hammer',  n:'锤式弯举',        m:'臂', eq:'哑铃',                k:'assist', s:3, r:[10,12], w:10, st:1},
  {id:'ext',     n:'仰卧哑铃臂屈伸',  m:'臂', eq:'可调凳+哑铃',        k:'assist', s:3, r:[10,12], w:8,  st:1},
  {id:'ohext',   n:'过顶单臂臂屈伸',  m:'臂', eq:'哑铃',                k:'assist', s:3, r:[10,12], w:10, st:1},
  {id:'calf',    n:'站姿哑铃提踵',    m:'腿', eq:'哑铃+踏板',           k:'assist', s:3, r:[15,20], w:16, st:2},
  {id:'shrug',   n:'哑铃耸肩',        m:'背', eq:'哑铃',                k:'assist', s:3, r:[12,15], w:20, st:2},
  // 核心（腹肌板 / 单杠 / 训练垫）
  {id:'hleg',    n:'悬垂举腿',        m:'核心', eq:'深蹲架单杠',        k:'core', s:3, r:[10,15], w:0, st:0},
  {id:'situp',   n:'腹肌板卷腹',      m:'核心', eq:'腹肌板',            k:'core', s:3, r:[15,20], w:0, st:0},
  {id:'twist',   n:'哑铃俄罗斯转体',  m:'核心', eq:'哑铃+训练垫',       k:'core', s:3, r:[16,20], w:8, st:1},
  {id:'plank',   n:'平板支撑',        m:'核心', eq:'训练垫',            k:'core', s:3, r:[45,60], u:'秒', w:0, st:0},
  {id:'splank',  n:'侧平板支撑',      m:'核心', eq:'训练垫',            k:'core', s:3, r:[30,45], u:'秒/侧', w:0, st:0},
  {id:'deadbug', n:'死虫式',          m:'核心', eq:'训练垫',            k:'core', s:3, r:[10,12], u:'次/侧', w:0, st:0},
  {id:'birddog', n:'鸟狗式',          m:'核心', eq:'训练垫',            k:'core', s:3, r:[10,12], u:'次/侧', w:0, st:0},
  // 胸部：默认关闭，需要时可在设置里打开
  {id:'dbbench', n:'哑铃卧推',        m:'胸', eq:'可调凳+哑铃',        k:'main', s:3, r:[8,12], w:18, st:2, chest:true},
  {id:'incbench',n:'上斜哑铃卧推',    m:'胸', eq:'可调凳+哑铃',        k:'main', s:3, r:[8,12], w:16, st:2, chest:true},
  {id:'bbbench', n:'杠铃卧推',        m:'胸', eq:'深蹲架+奥杆+可调凳', k:'main', s:4, r:[6,10], w:50, st:5, chest:true},
  {id:'pushup',  n:'俯卧撑',          m:'胸', eq:'徒手',                k:'assist', s:3, r:[12,20], w:0, st:0, chest:true}
];
const KIND = {main:'主项·复合', assist:'辅助·补短板', core:'核心'};

/* ============ 初始记录：2026-11-17 那一次训练 ============
   只在「本地没有任何记录」且从未预置过时写入一次，不会覆盖也不会重复。
   数据来源：用户的训练截图（引体向上 4 组 / 肩推 3 组 / 弯举 3 组 / 提踵 3 组，共 13 组、1560kg） */
const SEED_RECORDS = [{
  id: 'seed20261117',
  ts: new Date('2026-11-17T19:30:00+08:00').getTime(),
  date: '2026-11-17',
  note: '',
  items: [
    {name:'引体向上',     muscle:'背', equip:'深蹲架单杠', unit:'次', note:'',
     sets:[{reps:6,weight:0},{reps:6,weight:0},{reps:6,weight:0},{reps:6,weight:0}]},

     sets:[{reps:6,weight:30},{reps:6,weight:30},{reps:6,weight:30}]},

/* ============ 存储 ============ */
const KEY = 'personal_fitness_log_v1';
const KEY_BAK = KEY + '__bak';     // 上一份存档（每次保存前自动轮换）
const KEY_RAW = KEY + '__raw';     // 读不出来的原始数据，永远保留
const DEFAULT_SETTINGS = {chestEnabled:false, planSize:5, state:'normal', seed:0, variant:0};
function normalizeSettings(o){
  const src = o && typeof o==='object' ? o : {};
  const planSize = [4,5,6].indexOf(Number(src.planSize))>=0 ? Number(src.planSize) : DEFAULT_SETTINGS.planSize;
  const state = ['normal','legs','tight'].indexOf(src.state)>=0 ? src.state : DEFAULT_SETTINGS.state;
  const seed = Number(src.seed);
  const variant = Number(src.variant);
  return {
    chestEnabled:src.chestEnabled===true,
    planSize:planSize,
    state:state,
    seed:Number.isSafeInteger(seed) && seed>=0 ? seed : DEFAULT_SETTINGS.seed,
    variant:Number.isSafeInteger(variant) && variant>=0 ? variant % 100000 : 0
  };
}
let storageOK = true;      // 当前窗口是否允许写入本地存储
let dataLocked = false;    // 旧数据解析失败时锁住写入，防止被空数据覆盖
let loadNotice = '';       // 启动时需要提示的恢复信息
let lastSavedAt = 0;
let S = load();
let currentPlan = [];
let draft = null;
let editingId = null;   // 非空时表示正在编辑某条历史记录

function normalizeRecord(raw, index){
  if(!raw || typeof raw!=='object' || !Array.isArray(raw.items) || !raw.items.length) return null;
  const date = typeof raw.date==='string' ? raw.date : '';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || todayStr(new Date(date+'T00:00:00'))!==date) return null;
  if(date<'1900-01-01' || date>'2100-12-31') return null;
  if(raw.items.length>60) return null;
  const items = [];
  for(const it of raw.items){
    if(!it || typeof it!=='object' || typeof it.name!=='string' || !it.name.trim() || !Array.isArray(it.sets)) return null;
    if(it.sets.length>40) return null;
    const sets = [];
    for(const set of it.sets){
      if(!set || typeof set!=='object') return null;
      const reps = Number(set.reps), weight = Number(set.weight);
      if(!Number.isFinite(reps) || !Number.isFinite(weight) || reps<0 || weight<0 || reps>100000 || weight>100000) return null;
      sets.push({reps:reps, weight:weight});
    }
    items.push({
      name:it.name.trim().slice(0,120), muscle:String(it.muscle||'其他').slice(0,40),
      equip:String(it.equip||'').slice(0,120), unit:String(it.unit||'次').slice(0,20),
      sets:sets, note:String(it.note||'').slice(0,1000)
    });
  }
  const ts = Number(raw.ts);
  const id = typeof raw.id==='string' && /^[A-Za-z0-9_-]{1,80}$/.test(raw.id) ? raw.id : 'r'+Date.now().toString(36)+'_'+index;
  return {id:id, ts:Number.isFinite(ts) && ts>=0 ? ts : 0, date:date,
    note:String(raw.note||'').slice(0,2000), items:items};
}
function parseStore(raw){
  if(!raw) return null;
  let o;
  try{ o = JSON.parse(raw); }catch(e){ return null; }
  if(!o || typeof o!=='object' || !Array.isArray(o.records)) return null;
  const records = [];
  let repaired = 0;
  o.records.forEach((r,i)=>{
    const good = normalizeRecord(r, i);
    if(good){ records.push(good); return; }
    const salvaged = salvageRecord(r, i);   // 严格校验失败时，尽量宽松救回来
    if(salvaged){ records.push(salvaged); repaired++; }
  });
  /* 有记录但一条都救不回来 → 当作解析失败，绝不能把空数组当成真实数据写回去 */
  if(o.records.length && !records.length) return null;
  const seen = new Set();
  for(const rec of records){
    let id = rec.id, n = 1;
    while(seen.has(id)){ id = rec.id + '_' + (n++); }
    rec.id = id; seen.add(id);
  }
  return {records:records, settings:normalizeSettings(o.settings), repaired:repaired};
}
function readKey(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function writeKey(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
function probeStorage(){
  const probe = '__fitness_probe__';
  storageOK = writeKey(probe, '1');
  try{ localStorage.removeItem(probe); }catch(e){}
  return storageOK;
}
function load(){
  const raw = readKey(KEY);
  const primary = parseStore(raw);
  if(primary){
    if(primary.repaired){
      writeKey(KEY_RAW, raw);
      loadNotice = '有 '+primary.repaired+' 条记录格式异常，已自动修复后读入（原始数据已留档）。';
    }
    return {records:primary.records, settings:primary.settings};
  }
  const backupRaw = readKey(KEY_BAK);
  const backup = parseStore(backupRaw);
  if(raw){
    /* 主存档存在却读不出来：先把原始串原样留档，再从备份恢复 */
    writeKey(KEY_RAW, raw);
    if(backup){
      loadNotice = '主存档读取异常，已自动从上一份备份恢复（原始数据已另存留档）。';
      return {records:backup.records, settings:backup.settings};
    }
    dataLocked = true;
    loadNotice = '本地旧数据无法解析，已暂停写入以免覆盖。点下方「尝试修复旧数据」或先导出原始数据。';
    return {records:[], settings:normalizeSettings()};
  }
  if(backup){
    loadNotice = '主存档不见了，已从上一份备份恢复。';
    return {records:backup.records, settings:backup.settings};
  }
  return {records:[], settings:normalizeSettings()};
}
function save(){
  if(dataLocked){
    toast('已暂停写入：检测到旧数据无法解析，请先到设置页导出原始数据');
    return false;
  }
  const payload = JSON.stringify(S);
  const prev = readKey(KEY);
  if(prev && prev !== payload) writeKey(KEY_BAK, prev);   // 写新之前先把上一份留底
  if(!writeKey(KEY, payload)){
    storageOK = false;
    toast('保存失败：当前窗口禁止本地存储，记录只在页面内存里，刷新就会丢失');
    updateStorageBanner();
    return false;
  }
  storageOK = true;
  lastSavedAt = Date.now();
  loadNotice = '';
  updateStorageBanner();
  return true;
}
/* 宽松版的记录清洗：尽量把旧数据救回来（丢字段、日期异常也能救） */
function salvageRecord(raw, index){
  if(!raw || typeof raw!=='object' || !Array.isArray(raw.items)) return null;
  const items = [];
  for(const it of raw.items){
    if(!it || typeof it!=='object' || typeof it.name!=='string' || !it.name.trim()) continue;
    const sets = (Array.isArray(it.sets) ? it.sets : []).map(s=>({
      reps: Math.max(0, Math.min(100000, Number(s && s.reps) || 0)),
      weight: Math.max(0, Math.min(100000, Number(s && s.weight) || 0))
    }));
    if(!sets.length) continue;
    items.push({name:it.name.trim().slice(0,120), muscle:String(it.muscle||'其他').slice(0,40),
      equip:String(it.equip||'').slice(0,120), unit:String(it.unit||'次').slice(0,20),
      sets:sets.slice(0,40), note:String(it.note||'').slice(0,1000)});
    if(items.length>=60) break;
  }
  if(!items.length) return null;
  let date = typeof raw.date==='string' ? raw.date : '';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || todayStr(new Date(date+'T00:00:00'))!==date){
    const tsNum = Number(raw.ts);
    date = Number.isFinite(tsNum) && tsNum>0 ? todayStr(new Date(tsNum)) : todayStr();
  }
  const ts = Number(raw.ts);
  return {
    id: typeof raw.id==='string' && /^[A-Za-z0-9_-]{1,80}$/.test(raw.id) ? raw.id : 'r'+Date.now().toString(36)+'_'+index,
    ts: Number.isFinite(ts) && ts>=0 ? ts : 0,
    date: date, note: String(raw.note||'').slice(0,2000), items: items
  };
}
function repairFromRaw(){
  const raw = readKey(KEY_RAW) || readKey(KEY);
  if(!raw){ toast('没有找到可修复的旧数据'); return; }
  let o;
  try{ o = JSON.parse(raw); }
  catch(e){ toast('旧数据不是有效 JSON，无法自动修复，请先下载原始数据'); return; }
  if(!o || !Array.isArray(o.records)){ toast('旧数据格式无法自动修复，请先下载原始数据'); return; }
  const seen = new Set(), records = [];
  o.records.forEach((r,i)=>{
    const rec = salvageRecord(r,i);
    if(rec && !seen.has(rec.id)){ seen.add(rec.id); records.push(rec); }
  });
  if(!records.length){ toast('没能从旧数据里抢救出有效记录'); return; }
  if(!confirm('从旧数据里抢救出 '+records.length+' 条记录，将替换当前列表（原始数据仍留档一份）。继续？')) return;
  S = {records:records, settings:normalizeSettings(o.settings)};
  dataLocked = false; loadNotice = '';
  draft = null; editingId = null;
  save();
  renderLogBody(); renderPlan(); renderHistory(); renderSettings(); renderOverview(); switchTab('plan');
  toast('已修复并恢复 '+records.length+' 条记录');
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(d){
  const t = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate());
}
function daysSince(dateStr){
  const a = new Date(dateStr+'T00:00:00'), b = new Date(todayStr()+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function sortedRecs(){ return S.records.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.ts||0)-(a.ts||0)); }
function unitOf(ex){ return ex.u || '次'; }
function fmtW(w){ return (+w>0) ? (+w)+'kg' : '自重'; }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clampNum(v, max){ const n = Number(v); return Number.isFinite(n) && n>0 ? Math.min(n, max) : 0; }
/* 一组数据的展示：有重量显示 次数×重量，自重/计时动作只显示次数或秒数 */
function fmtSet(s, unit){

/* ============ 推荐算法：渐进超负荷 + 补短板 ============ */
function findLastItem(name){
  for(const r of sortedRecs()){
    const it = (r.items||[]).find(x=>x.name===name);
    if(it) return {it:it, date:r.date};
  }
  return null;
}
function advise(ex){
  const hit = findLastItem(ex.n);
  const top = ex.r[1];
  if(!hit){
    return {w:ex.w, label:fmtW(ex.w), tag:'首次·建立基准', kind:'n',
      why:'第一次记录这个动作，先用能标准完成 '+ex.r[0]+'~'+top+' '+unitOf(ex)+' 的重量（留 2~3 次余力），下次就能自动判断加重时机。'};
  }
  const sets = hit.it.sets || [];
  if(!sets.length){
    return {w:ex.w, label:fmtW(ex.w), tag:'首次·建立基准', kind:'n',
      why:'上次没有组数据，这次记全每组次数和重量，下次即可自动判断加重时机。'};
  }
  const baseW = Math.max.apply(null, sets.map(s=>+s.weight||0).concat([0]));
  const allHit = sets.every(s=>(+s.reps||0) >= top);
  if(ex.st>0 && baseW<=0){
    return {w:ex.w, label:fmtW(ex.w), tag:'先补记重量', kind:'n',
      why:'上次没填重量，这次记下实际用的重量，之后才能自动判断何时该加重。'};
  }
  if(allHit && ex.st>0){
    const nw = Math.round((baseW+ex.st)*10)/10;
    return {w:nw, label:nw+'kg', tag:'渐增加重 +'+ex.st+'kg', kind:'up',
      why:'上次 '+sets.length+' 组全部做到 '+top+' '+unitOf(ex)+'以上，这次加 '+ex.st+'kg，次数回落到 '+ex.r[0]+'~'+top+' '+unitOf(ex)+' 重新爬坡。'};
  }
  if(allHit && ex.st===0){
    return {w:0, label:'自重', tag:'进阶变式', kind:'up',
      why:'上次全部组达标，这次每组再多 1~2 次，或放慢离心到 3 秒 / 加负重，继续制造进步。'};
  }
  return {w:baseW, label:fmtW(baseW), tag:'巩固·冲次数', kind:'hold',
    why:'上次还有组没到 '+top+' '+unitOf(ex)+'，重量先不变，把每组都推到上限再加重。'};
}

function heatColor(v){

function bodySVG(side, stat){
  const isBack = side==='back';
  // 背面原始模型比正面长约 10%，统一压回同一画布高度，两幅图并排时等高
  const g = isBack ? ' transform="scale(1,.905)"' : '';
  let s = '<svg viewBox="0 0 100 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+(isBack?'背面':'正面')+'肌群热图">';
  s += '<g'+g+' fill="var(--m-base)" stroke="var(--m-line)" stroke-width=".4" stroke-linejoin="round">';
  BODY_MODEL[side].forEach(grp=>{
    const fill = (grp.m==='_') ? 'var(--m-base)' : heatColor(stat[grp.m]||0);
    grp.p.forEach(pts=>{ s += '<polygon points="'+pts+'" fill="'+fill+'"/>'; });
  });
  s += '</g></svg>';
  return s;
}
function noise(ex){ return (hash(ex.id+'#'+S.settings.seed)%100)/100 * 1.8; }
/* 从候选池里挑 count 个，先按评分排序，再按 rotate 旋转「优先候选区」的起点。
   rotate=0 时与原来完全一致；点「换一批」时改 rotate，就一定能换到不同但同样合理的动作 */
function pickDiverse(pool, count, scoreFn, banned, rotate){
  const scored = pool.map(e=>({e:e, s:scoreFn(e)})).sort((a,b)=>b.s-a.s);
  const out = [], used = new Set(banned||[]);
  if(!scored.length) return out;
  const shortLen = Math.min(scored.length, Math.max(count*3, count));
  let shortlist = scored.slice(0, shortLen);
  const k = shortLen ? (((rotate||0) % shortLen) + shortLen) % shortLen : 0;
  if(k) shortlist = shortlist.slice(k).concat(shortlist.slice(0, k));
  for(const c of shortlist){ if(out.length>=count) break; if(used.has(c.e.m)) continue; used.add(c.e.m); out.push(c.e); }
  for(const c of shortlist){ if(out.length>=count) break; if(out.indexOf(c.e)<0) out.push(c.e); }
  for(const c of scored){ if(out.length>=count) break; if(out.indexOf(c.e)<0) out.push(c.e); }
  return out;
}
function buildPlan(){
  const ms = muscleStats();
  const lastRec = ms.recent[0];
  const lastNames = new Set(((lastRec&&lastRec.items)||[]).map(i=>i.name));
  const fatigue = S.settings.state==='legs';
  const tight = S.settings.state==='tight';
  const total = tight ? 4 : (+S.settings.planSize || 5);
  // 4~6 个动作：优先保住主项的重量连续性，其余名额用于补短板和核心
  const quota = ({4:[2,1,1], 5:[2,2,1], 6:[3,2,1]})[total] || [2,1,1];
  const pool = allEx().filter(e=>{
    if(fatigue && e.m==='腿' && e.k==='main') return false;
    return true;
  });
  const weak = m => (12 - Math.min(ms.stat[m]||0, 12));
  // 主项优先延续上次练过的动作，保证重量/次数能连续跟踪（渐进超负荷的前提）
  const mainScore = e => {
    const a = advise(e);
    return weak(e.m)/3 + (a.kind==='up'?3.2:(a.kind==='hold'?2.2:0)) + (lastNames.has(e.n)?0.5:0) + noise(e);
  };
  const assistScore = e => weak(e.m)/2 + (lastNames.has(e.n)?-1:0.4) + noise(e);
  const lightScore = e => (lastNames.has(e.n)?-0.8:0.6) + noise(e);

  const rot = S.settings.variant || 0;
  const mains = pickDiverse(pool.filter(e=>e.k==='main'), quota[0], mainScore, [], rot);
  const covered = new Set(mains.map(e=>e.m));
  const assists = pickDiverse(pool.filter(e=>e.k==='assist' && mains.indexOf(e)<0), quota[1],
    e=>assistScore(e) + (covered.has(e.m)?-1.5:1.5), [], rot+1);
  const cores = pickDiverse(pool.filter(e=>e.k==='core'), quota[2], lightScore, [], rot+2);
  const chosen = mains.concat(assists, cores);

  return chosen.map(ex=>{
    const a = advise(ex);
    let why = a.why;
    if(ex.k==='main' || ex.k==='assist'){
      const n = ms.stat[ex.m]||0;
      if(ms.recent.length && n < 8) why += ' 近 '+ms.recent.length+' 次训练「'+ex.m+'」'+(n===0?'尚未覆盖':'仅 '+n+' 组')+'，是当前短板，优先补齐。';
    }
    if(ex.k==='core') why += ' 核心抗伸展/抗旋转，对跑步时的躯干稳定和力量传导直接有用。';
    return {ex:ex, sets:ex.s, reps:ex.r[0]+'~'+ex.r[1]+' '+unitOf(ex), w:a.w, label:a.label, tag:a.tag, kind:a.kind, why:why};
  });
}

function renderPlan(){
  currentPlan = buildPlan();
  const totalSetsPlan = currentPlan.reduce((a,p)=>a+p.sets,0);
  const st = S.settings.state;
  const stateLabel = {normal:'正常', legs:'刚跑完，下肢疲劳', tight:'时间紧，缩短训练'}[st];
  const empty = S.records.length===0;
  let h = '';
  h += '<div class="card"><div id="rhythm" class="banner"></div>';
  h += '<div class="plan-head">';
  h += '<div><h2 style="margin-bottom:2px">下次训练建议 · '+todayStr()+'</h2><div class="muted small">共 '+currentPlan.length+' 个动作 / 约 '+totalSetsPlan+' 组 · 依据最近 2 次训练自动计算</div></div>';
  h += '<div class="btnrow"><label style="margin:0">今日状态 <select id="stateSel" class="sel-inline">'+
       ['normal','legs','tight'].map(k=>'<option value="'+k+'"'+(st===k?' selected':'')+'>'+({normal:'正常',legs:'下肢疲劳(慢跑后)',tight:'时间紧'})[k]+'</option>').join('')+'</select></label>'+
       '<button class="btn sm" data-act="regen">换一批</button></div></div>';
  h += '<div class="small muted" style="margin-top:8px">当前状态：'+esc(stateLabel)+' · 推荐逻辑：渐进超负荷 + 补短板'+(st==='legs'?'（已自动剔除下肢大重量主项）':'')+(st==='tight'?'（压缩为 4 个动作：主项 2 + 辅助 1 + 核心 1）':'')+'</div>';
  if(empty) h += '<div class="banner warn" style="margin-top:12px">这是起步模板：还没有历史记录，重量只是参考起点。按体感调整并保存第一次训练后，下次推荐就会按你自己的数据进化。</div>';
  h += '<hr>';
  currentPlan.forEach((p,i)=>{
    const tagCls = p.kind==='up' ? 'o' : (p.kind==='hold' ? 'b' : 'm');
    h += '<div class="plan-item">'+
      '<div class="num">'+(i+1)+'</div>'+
      '<div><div class="pname">'+esc(p.ex.n)+' <span class="chip m">'+esc(p.ex.m)+'</span><span class="chip">'+KIND[p.ex.k]+'</span></div>'+
      '<div class="meta">器械：'+esc(p.ex.eq)+' · 建议 '+p.sets+' 组</div>'+
      '<div class="reason"><span class="chip '+tagCls+'">'+esc(p.tag)+'</span>'+esc(p.why)+'</div></div>'+
      '<div class="dose">'+p.sets+' × '+p.reps+'<small>'+((p.ex.u && p.ex.u!=='次' && !(p.w>0))?'无需负重':'建议重量：'+esc(p.label))+'</small></div>'+
    '</div>';
  });
  h += '<hr><div class="btnrow"><button class="btn primary" data-act="use-plan">按此计划开始记录</button>'+
       '<span class="muted small">一键带入下方表单，只需改成实际完成的次数和重量</span></div></div>';

  const ms = muscleStats();
  const shown = ['腿','背','肩','臂','核心','胸'];
  h += '<div class="card"><h2>近 2 次训练的肌群覆盖</h2>'+
       '<div class="muted small">颜色越深＝这个部位近 2 次累计组数越多、越疲劳；空白＝还没练到。推荐会优先补最浅的部位。</div>'+
       '<div class="heat-wrap">'+
         '<figure class="heat-fig">'+bodySVG('front', ms.stat)+'<figcaption class="fig-cap">正面</figcaption></figure>'+
         '<figure class="heat-fig">'+bodySVG('back', ms.stat)+'<figcaption class="fig-cap">背面</figcaption></figure>'+
         '<div class="heat-info">'+
           '<div class="heat-legend"><span>少</span><i></i><span>多</span></div>'+
           '<div class="heat-nums">'+shown.map(m=>'<span class="hn">'+m+' <b>'+(ms.stat[m]||0)+'</b> 组</span>').join('')+'</div>'+
           '<div class="small muted">人体轮廓数据：react-body-highlighter（MIT 许可）</div>'+
         '</div>'+
       '</div></div>';
  document.getElementById('view-plan').innerHTML = h;
  renderOverview();
}

function itemFromPlan(p){
  const ex = p.ex;
  return {exId:ex.id, name:ex.n, muscle:ex.m, equip:ex.eq, unit:unitOf(ex),
          sets:Array.from({length:p.sets},()=>({reps:ex.r[0], weight:p.w})),
          note:'', expanded:false, custom:false};
}
function syncDraft(){
  if(!draft) return;
  const rows = document.querySelectorAll('#exList .ex-row');
  if(!rows.length) return;
  const items = [];
  rows.forEach(row=>{
    const sel = row.querySelector('.f-name');
    const old = draft.items[items.length] || {};
    const it = {expanded:!!old.expanded, custom:false, sets:[], note:''};
    if(sel && sel.value==='__custom__'){
      it.exId='__custom__'; it.custom=true;
      it.name=(row.querySelector('.f-custom').value||'').trim() || '自定义动作';
      it.muscle=row.querySelector('.f-muscle').value;
      it.equip='自定义'; it.unit='次';
    }else if(sel){
      const ex = EX.find(e=>e.id===sel.value) || EX[0];
      it.exId=ex.id; it.name=ex.n; it.muscle=ex.m; it.equip=ex.eq; it.unit=unitOf(ex);
    }
    const n = Math.max(1, Math.min(12, +row.querySelector('.f-sets').value || 1));
    if(it.expanded){
      const sr = row.querySelectorAll('.set-row');
      for(let i=0;i<sr.length;i++){
        it.sets.push({reps:Math.max(0,+sr[i].querySelector('.s-reps').value||0), weight:Math.max(0,+sr[i].querySelector('.s-weight').value||0)});
      }
    }else{
      const reps = Math.max(0,+row.querySelector('.f-reps').value||0);
      const w = Math.max(0,+row.querySelector('.f-weight').value||0);
      for(let i=0;i<n;i++) it.sets.push({reps:reps, weight:w});
    }
    it.note = row.querySelector('.f-note').value||'';
    items.push(it);
  });
  draft.items = items;
  const d = document.getElementById('logDate'), nt = document.getElementById('logNote');
  if(d) draft.date = d.value || todayStr();
  if(nt) draft.note = nt.value;
}

       '<button class="btn ghost" data-act="clear-draft">清空表单</button></div>';

function saveLog(){
  syncDraft();
  if(!draft){ draft = newDraft(); }
  const date = /^\d{4}-\d{2}-\d{2}$/.test(draft.date||'') && todayStr(new Date(draft.date+'T00:00:00'))===draft.date
    ? draft.date : todayStr();
  const items = draft.items
    .filter(it=>it && it.name && String(it.name).trim() && Array.isArray(it.sets) && it.sets.length)
    .slice(0,40)
    .map(it=>({
      name:String(it.name).trim().slice(0,120),
      muscle:String(it.muscle||'其他').slice(0,40),
      equip:String(it.equip||'').slice(0,120),
      unit:String(it.unit||'次').slice(0,20),
      sets:it.sets.slice(0,30).map(s=>({reps:clampNum(s.reps,100000), weight:clampNum(s.weight,100000)})),
      note:String(it.note||'').slice(0,1000)
    }));
  if(!items.length){ toast('至少填写一个动作名称，并保证组数大于 0'); return; }
  const rec = {
    id: editingId || uid(), ts: Date.now(), date: date,
    note: String(draft.note||'').slice(0,2000), items: items
  };
  const isEdit = !!editingId;
  if(isEdit){
    const idx = S.records.findIndex(r=>r.id===editingId);
    if(idx>=0) S.records[idx] = rec; else S.records.push(rec);
  }else{
    S.records.push(rec);
  }
  editingId = null;
  const okSaved = save();
  draft = null;
  renderLogBody();
  renderPlan(); renderHistory(); renderOverview();
  switchTab('plan');
  toast(okSaved
    ? (isEdit?'已更新':'已保存')+' '+items.length+' 个动作 / '+totalSets(rec)+' 组'+(isEdit?'':'，下次推荐已更新')
    : (dataLocked
        ? '已暂停写入：检测到旧数据无法解析，请先在设置页导出原始数据'
        : '记录只留在当前页面，没能写入本地存储：刷新就会消失，请立刻点「导出 JSON 备份」'));
}

/* ============ 视图：历史记录 ============ */
function trendCard(){
  const recs = sortedRecs().slice(0,12).reverse();
  if(recs.length<2) return '';
  const useVol = recs.some(r=>volume(r)>0);
  const vals = recs.map(r=> useVol ? Math.round(volume(r)) : totalSets(r));
  const max = Math.max.apply(null, vals.concat([1])) || 1;
  const unit = useVol ? 'kg' : '组';
  let h = '<div class="card"><h2>近 '+recs.length+' 次训练趋势</h2>'+
    '<div class="muted small">'+(useVol?'柱高＝当次总容量（次数×重量，自重动作不计）':'柱高＝当次总组数')+' · 鼠标悬停可看具体数值</div>'+
    '<div class="trend">';
  recs.forEach((r,i)=>{
    const pct = Math.max(3, Math.round(vals[i]/max*100));
    h += '<div class="trend-bar" title="'+esc(r.date)+'：'+vals[i].toLocaleString()+' '+unit+'">'+
      '<i style="height:'+pct+'%"></i><span class="trend-x">'+esc(r.date.slice(5))+'</span></div>';
  });
  h += '</div></div>';
  return h;
}
function renderHistory(){
  const recs = sortedRecs();
  let h = '';
  if(!recs.length){
    h += '<div class="card"><h2>历史记录</h2><div class="muted">还没有训练记录。去「记录这次训练」保存第一次，之后所有推荐都会基于你的真实数据。</div></div>';
    document.getElementById('view-history').innerHTML = h; return;
  }
  h += trendCard();
  h += '<div class="card"><h2>历史记录</h2>';
  h += '<div class="muted small" style="margin-bottom:12px">共 '+recs.length+' 次 · 容量只统计填写了重量的组，自重动作不计入。</div>';
  recs.forEach(r=>{
    h += '<details><summary>'+esc(r.date)+' · '+r.items.length+' 个动作 / '+totalSets(r)+' 组 / '+Math.round(volume(r)).toLocaleString()+' kg</summary>';
    h += '<div class="muted small" style="margin-top:8px">'+((daysSince(r.date)===0)?'今天':(daysSince(r.date)+' 天前'))+(r.note?' · 备注：'+esc(r.note):'')+'</div>';
    h += '<div class="tbl"><table><thead><tr><th>动作</th><th>肌群</th><th>组 × 次 × 重量</th><th>备注</th></tr></thead><tbody>';
    r.items.forEach(it=>{
      const txt = (it.sets||[]).map(s=>fmtSet(s, it.unit)).join(' / ');
      h += '<tr><td data-l="动作">'+esc(it.name)+'</td><td data-l="肌群">'+esc(it.muscle||'—')+'</td><td data-l="组×次×重量">'+esc(txt)+'</td><td data-l="备注">'+esc(it.note||'')+'</td></tr>';
    });
    h += '</tbody></table></div><div class="btnrow" style="margin-top:12px">'+
      '<button class="btn sm" data-act="edit-rec" data-id="'+esc(r.id)+'">编辑这条</button>'+
      '<button class="btn sm" data-act="copy-rec" data-id="'+esc(r.id)+'">照此再练一次（预填表单）</button>'+
      '<button class="btn sm danger" data-act="del-rec" data-id="'+esc(r.id)+'">删除这条</button></div></details>';
  });
  h += '</div>';
  document.getElementById('view-history').innerHTML = h;
}

function downloadText(text, filename, type){
  const blob = new Blob([text], {type: type || 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function exportData(){
  const payload = {app:'个人健身记录本', version:2, exportedAt:new Date().toISOString(), records:S.records, settings:S.settings};
  downloadText(JSON.stringify(payload, null, 2), '健身记录备份-'+todayStr()+'.json', 'application/json');
  toast('备份已导出');
}
/* 导入备份：先校验，再询问，最后整体替换，避免把现有数据写坏 */
function importBackup(file){
  const rd = new FileReader();
  rd.onerror = ()=>toast('读取备份失败，请确认文件可访问后重试');
  rd.onload = ev=>{
    let o = null;
    try{ o = JSON.parse(String(ev.target.result)); }
    catch(err){ toast('导入失败：不是有效的 JSON 文件'); return; }
    if(!o || typeof o!=='object' || !Array.isArray(o.records)){ toast('导入失败：备份文件格式不对'); return; }
    const records = o.records.map(normalizeRecord);
    if(records.some(r=>!r)){ toast('导入失败：备份里有无法识别的记录'); return; }
    if(new Set(records.map(r=>r.id)).size!==records.length){ toast('导入失败：备份里有重复的记录 ID'); return; }
    const tip = records.length
      ? '导入将覆盖当前的 '+S.records.length+' 条记录（备份含 '+records.length+' 条），确定继续？'
      : '这个备份里没有任何训练记录，导入后会清空现有记录，确定继续？';
    if(!confirm(tip)) return;
    S = {records:records, settings:normalizeSettings(o.settings)};
    editingId = null; draft = null;
    save(); renderLogBody(); renderPlan(); renderHistory(); renderSettings(); renderOverview(); switchTab('plan');
    toast('已导入 '+S.records.length+' 条记录');
  };
  rd.readAsText(file);
}

/* ============ 交互 ============ */
function switchTab(v){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  ['plan','log','history','settings'].forEach(k=>{
    document.getElementById('view-'+k).classList.toggle('hide', k!==v);
  });
  if(v==='plan') renderPlan();
  if(v==='history') renderHistory();
  if(v==='settings') renderSettings();
  if(v==='log' && !draft){ draft = newDraft(); renderLogBody(); }
  renderOverview();
  window.scrollTo({top:0, behavior:'smooth'});
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if(act==='tab'){ switchTab(b.dataset.v); }
  else if(act==='regen'){
    /* 换一批：推进 variant 旋转候选池，直到动作组合真的变了（最多试 30 次） */
    const sig = plan => plan.map(p=>p.ex.id).join(',');
    const before = sig(currentPlan);
    let tries = 0;
    do{
      S.settings.variant = ((S.settings.variant||0) + 1) % 997;
      S.settings.seed = (S.settings.seed + 1) % 100000;
    }while(tries++<30 && sig(buildPlan())===before);
    save(); renderPlan(); renderOverview(); toast('已换一批动作（建议重量仍按各动作自己的历史计算）');
  }
  else if(act==='use-plan'){
    editingId = null;
    draft = {date:todayStr(), note:'', items:currentPlan.map(itemFromPlan)};
    renderLogBody(); switchTab('log'); toast('已带入 '+draft.items.length+' 个动作，改成实际完成的次数和重量即可');
  }
  else if(act==='add-row'){ syncDraft(); if(!draft) draft = newDraft(); draft.items.push(blankItem()); renderLogBody(); }
  else if(act==='del-row'){
    syncDraft(); if(!draft) return;
    if(draft.items.length<=1){ toast('至少保留一个动作'); return; }
    draft.items.splice(i,1); renderLogBody();
  }
  else if(act==='toggle-sets'){
    syncDraft(); if(!draft || !draft.items[i]) return;
    draft.items[i].expanded = !draft.items[i].expanded; renderLogBody();
  }
  else if(act==='save-log'){ saveLog(); }
  else if(act==='clear-draft'){
    if(confirm(editingId?'放弃本次编辑并清空表单？原记录不会被修改。':'清空当前未保存的表单？')){
      editingId = null; draft = null; renderLogBody();
    }
  }
  else if(act==='cancel-edit'){ editingId = null; draft = null; renderLogBody(); toast('已退出编辑，原记录未被修改'); }
  else if(act==='del-rec'){
    const rec = S.records.find(r=>r.id===b.dataset.id);
    if(!rec) return;
    if(!confirm('确定删除 '+rec.date+' 的这条训练记录？删除后推荐也会随之变化。')) return;
    S.records = S.records.filter(r=>r.id!==rec.id);
    if(editingId===rec.id) editingId = null;
    save(); renderHistory(); renderPlan(); renderOverview(); toast('已删除');
  }
  else if(act==='edit-rec'){
    const r = S.records.find(x=>x.id===b.dataset.id); if(!r) return;
    editingId = r.id;
    draft = {date:r.date, note:r.note||'', items:r.items.map(it=>{
      const ex = findEx(it.name);
      return {exId: ex?ex.id:'__custom__', name:it.name, muscle:it.muscle||'其他',
        equip:it.equip||'', unit:it.unit||'次', custom:!ex,
        sets:it.sets.map(s=>({reps:s.reps, weight:s.weight})), note:it.note||'', expanded:false};
    })};
    renderLogBody(); switchTab('log'); toast('正在编辑 '+r.date+' 的记录，保存后覆盖原记录');
  }
  else if(act==='copy-rec'){
    const r = S.records.find(x=>x.id===b.dataset.id); if(!r) return;
    editingId = null;
    draft = {date:todayStr(), note:'', items:r.items.map(it=>({
      exId:(findEx(it.name)||{}).id || '__custom__', name:it.name, muscle:it.muscle||'其他',
      equip:it.equip||'', unit:it.unit||'次', custom:!findEx(it.name),
      sets:it.sets.map(s=>({reps:s.reps, weight:s.weight})), note:it.note||'', expanded:false
    }))};
    renderLogBody(); switchTab('log'); toast('已预填，按今天实际表现修改后保存');
  }
  else if(act==='export'){ exportData(); }
  else if(act==='download-raw'){
    const raw = readKey(KEY_RAW) || readKey(KEY) || '';
    if(!raw){ toast('没有可下载的原始数据'); return; }
    downloadText(raw, '健身记录-原始数据-'+todayStr()+'.json', 'application/json');
    toast('原始数据已下载，可发给我帮你修复');
  }
  else if(act==='unlock-data'){
    if(!confirm('确认已经导出原始数据？继续后将允许覆盖旧数据。')) return;
    dataLocked = false; loadNotice = '';
    save(); renderSettings(); toast('已解除写入锁定');
  }
  else if(act==='repair-data'){ repairFromRaw(); }
  else if(act==='recheck-storage'){
    probeStorage(); updateStorageBanner(); renderSettings();
    toast(storageOK ? '本地存储可用' : '本地存储仍不可用，请换浏览器直接打开文件');
  }
  else if(act==='clear-all'){
    if(!confirm('将清空全部训练记录且无法恢复，建议先导出备份。确定继续？')) return;
    if(!confirm('再确认一次：真的清空所有记录？')) return;
    S.records = []; editingId = null; save(); draft=null; renderLogBody(); renderPlan(); renderHistory(); renderOverview(); switchTab('plan'); toast('已清空');
  }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.id==='stateSel'){ S.settings.state = t.value; save(); renderPlan(); return; }
  if(t.id==='planSize'){ S.settings.planSize = +t.value; save(); renderPlan(); return; }
  if(t.id==='chestToggle'){ S.settings.chestEnabled = (t.value==='on'); save(); renderPlan(); renderSettings(); return; }
  if(t.id==='importFile'){
    const f = t.files && t.files[0];
    if(f) importBackup(f);
    t.value='';
    return;
  }
  if(t.classList.contains('f-name')){
    syncDraft();
    if(!draft) return;
    const row = t.closest('.ex-row');
    const idx = row ? +row.dataset.i : -1;
    if(!draft.items[idx]) return;
    if(t.value==='__custom__'){
      draft.items[idx].custom = true; draft.items[idx].exId = '__custom__';
      draft.items[idx].name = '';            /* 清空名称，让用户直接输入自己的动作名 */
    }
    renderLogBody();
    return;
  }
  if(t.classList.contains('f-sets')){
    syncDraft();
    if(!draft) return;
    const row = t.closest('.ex-row');
    const idx = row ? +row.dataset.i : -1;
    const it = draft.items[idx];
    if(!it || !Array.isArray(it.sets)) return;
    const n = Math.max(1, Math.min(12, +t.value||1));
    while(it.sets.length<n) it.sets.push(Object.assign({}, it.sets[it.sets.length-1] || {reps:8,weight:0}));
    it.sets.length = n;
    renderLogBody();
    return;
  }
});

/* ============ 启动 ============ */
probeStorage();
const seedMsg = seedIfEmpty();
updateStorageBanner();
renderLogBody();
renderPlan();
renderHistory();
renderSettings();
renderOverview();
if(seedMsg) toast(seedMsg);
if(loadNotice) toast(loadNotice);
/* 跟随系统切换深浅色时，重画热图（热图颜色需要按主题重算） */
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onTheme = ()=>{ renderPlan(); };
  if(mq.addEventListener) mq.addEventListener('change', onTheme);
  else if(mq.addListener) mq.addListener(onTheme);
}
</script>
</body>
</html>
